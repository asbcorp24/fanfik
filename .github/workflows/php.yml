name: PHP checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring, curl
          coverage: none
      - name: Validate PHP syntax
        run: find public src bin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: SQLite and comment smoke test
        run: php tests/smoke.php
